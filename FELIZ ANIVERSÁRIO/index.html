<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aniversário Atrasado 😅</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      text-align: center;
    }

    .card {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    button {
      background: #fff;
      color: #ff6b81;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
      transition: 0.3s;
    }

    button:hover {
      background: #ff6b81;
      color: #fff;
    }

    .hidden {
      display: none;
      margin-top: 20px;
      font-size: 1.3em;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div class="card">
  <h1>🎂 PERA…</h1>
  <p>Eu não esqueci seu aniversário…<br>
  só dei um *delay artístico* 😎</p>

  <button onclick="celebrar()">CLICA AQUI (confia)</button>

  <div id="mensagem" class="hidden">
    🎉 FELIZ ANIVERSÁRIO ATRASADO!!! 🎉<br><br>
    Que a tua vida seja tão incrível quanto<br>
    a minha habilidade de criar sistemas inúteis 😅<br><br>
     ❤️
  </div>
</div>

<audio id="musica" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
  function celebrar() {
    document.getElementById("mensagem").classList.remove("hidden");
    document.getElementById("musica").play();
    iniciarConfete();
  }

  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let confetes = [];

  function criarConfete() {
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      r: Math.random() * 6 + 2,
      d: Math.random() * 5 + 2,
      color: `hsl(${Math.random()*360}, 100%, 60%)`
    };
  }

  for (let i = 0; i < 150; i++) {
    confetes.push(criarConfete());
  }

  function desenharConfete() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    confetes.forEach(c => {
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = c.color;
      ctx.fill();
    });

    atualizarConfete();
  }

  function atualizarConfete() {
    confetes.forEach(c => {
      c.y += c.d;
      if (c.y > canvas.height) {
        c.y = -10;
        c.x = Math.random() * canvas.width;
      }
    });
  }

  function iniciarConfete() {
    setInterval(desenharConfete, 20);
  }
</script>

</body>
</html>
